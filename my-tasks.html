<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scimax IEG — My Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- base IEG styles, generated by build/build-css.js -->
  <link rel="stylesheet" href="assets/ieg.css">
  <!-- pubs colours + overrides -->
  <link rel="stylesheet" href="assets/pubs-theme.css">
  <link rel="stylesheet" href="assets/pubs-skin.css">
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans">
  <app-root style="display:contents">
    <app-ambient-bg>
      <div class="ambient-bg">
        <div class="orb w-[500px] h-[500px] top-[-10%] left-[-10%] animate-blob"></div>
        <div class="orb w-[400px] h-[400px] top-[20%] right-[-5%] animate-blob" style="animation-delay: 2s;"></div>
        <div class="orb w-[600px] h-[600px] bottom-[-20%] left-[20%] animate-blob" style="animation-delay: 4s;"></div>
      </div>
    </app-ambient-bg>
    <app-toast><div id="toast-stack" class="fixed bottom-24 md:bottom-10 right-4 md:right-10 z-[14000] flex flex-col space-y-3 pointer-events-none"></div></app-toast>

    <app-internal-main-layout>
      <!-- top-right account bar -->
      <div class="layout-utility-anchor">
        <app-header-utility-bar class="layout-utility-bar">
          <div class="utility-bar utility-bar--labeled" role="toolbar" aria-label="Account and support">
            <div class="utility-bar__cluster">
              <button type="button" class="utility-btn utility-btn--alerts" data-tooltip="Notifications" aria-label="Notifications" data-util="alerts">
                <i data-lucide="bell" class="utility-btn__icon"></i><span class="utility-btn__label">Alerts</span>
                <span class="utility-btn__badge utility-btn__badge--count" aria-hidden="true" data-alert-count>3</span>
              </button>
              <button type="button" class="utility-btn" data-tooltip="FAQ" aria-label="FAQ" data-util="faq"><i data-lucide="book-open" class="utility-btn__icon"></i><span class="utility-btn__label">FAQ</span></button>
              <button type="button" class="utility-btn" data-tooltip="Help" aria-label="Help" data-util="help"><i data-lucide="help-circle" class="utility-btn__icon"></i><span class="utility-btn__label">Help</span></button>
            </div>
            <span class="utility-bar__rule" aria-hidden="true"></span>
            <div class="utility-nav-slot">
              <button type="button" class="utility-btn utility-btn--admin" data-tooltip="Administration" aria-label="Administration" data-util="admin"><i data-lucide="settings" class="utility-btn__icon"></i><span class="utility-btn__label">Admin</span></button>
              <button type="button" class="utility-btn utility-btn--dashboard utility-nav-slot__btn--inactive" aria-hidden="true" tabindex="-1" data-util="dashboard"><i data-lucide="layout-dashboard" class="utility-btn__icon"></i><span class="utility-btn__label">Dashboard</span></button>
            </div>
            <button type="button" class="utility-profile" data-tooltip="Profile" aria-label="Profile" aria-haspopup="dialog" data-util="profile">
              <span class="utility-profile__avatar" aria-hidden="true">AS</span>
              <span class="utility-profile__name">Ananya Sharma</span>
              <i data-lucide="chevron-down" class="utility-profile__chevron" aria-hidden="true"></i>
            </button>
            <span class="utility-bar__rule" aria-hidden="true"></span>
            <button type="button" class="utility-btn utility-btn--logout" data-tooltip="Sign out" aria-label="Logout" data-util="logout"><i data-lucide="log-out" class="utility-btn__icon"></i><span class="utility-btn__label">Sign out</span></button>
          </div>
        </app-header-utility-bar>
      </div>

      <div class="view-section active w-full h-full flex flex-col z-10 gap-0 p-0 items-stretch">
        <div class="flex-1 flex flex-row gap-0 md:gap-4 p-0 md:py-4 md:px-4 items-stretch overflow-hidden min-h-0 min-w-0">
          <app-sidebar>
            <aside class="sidebar-root glass-panel rounded-3xl flex flex-col py-6 hidden md:flex shadow-glass">
              <button type="button" class="sidebar-brand" aria-label="Collapse navigation" title="SCIMAX IEG">
                <div class="sidebar-brand-mark sidebar-brand-mark--svg"><img src="assets/ieg-logo.svg" alt="SCIMAX IEG" class="sidebar-brand-svg"/></div>
              </button>
              <nav class="sidebar-nav">
                <a href="#" class="sidebar-nav-item" aria-label="Dashboard" data-nav="dashboard"><span class="sidebar-nav-item-inner"><span class="sidebar-nav-icon"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></span><span class="sidebar-nav-label">Dashboard</span></span></a>
                <a href="#" class="sidebar-nav-item is-active" aria-label="Tasks" data-nav="tasks"><span class="sidebar-nav-item-inner"><span class="sidebar-nav-icon"><i data-lucide="clipboard-list" class="w-5 h-5"></i></span><span class="sidebar-nav-label">Tasks</span></span></a>
                <a href="#" class="sidebar-nav-item" aria-label="Notifications" data-nav="alerts"><span class="sidebar-nav-item-inner"><span class="sidebar-nav-icon"><i data-lucide="bell" class="w-5 h-5"></i><span class="sidebar-nav-badge absolute top-3 right-3 w-2.5 h-2.5 bg-red-500 border-2 border-white/80 rounded-full animate-pulse-slow" data-alert-badge></span></span><span class="sidebar-nav-label">Notifications</span></span></a>
              </nav>
            </aside>
          </app-sidebar>

          <main class="flex-1 flex flex-col h-full overflow-hidden relative min-h-0 min-w-0 w-full max-w-full">
            <app-my-tasks id="page"></app-my-tasks>
          </main>
        </div>
      </div>

      <app-alerts-panel id="alerts-host"></app-alerts-panel>
      <app-help-panel id="help-host"></app-help-panel>
      <div id="modal-host" style="display:contents"></div>
    </app-internal-main-layout>
  </app-root>

  <script src="assets/lucide.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
